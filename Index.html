<style>
html,body{height:100%;margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef2f5}
#app{height:100%;display:grid;grid-template-columns:350px 1fr}
#sidebar{padding:14px;background:#fff;overflow:auto;border-right:1px solid #ccd4dc;z-index:1000}
h2{margin:0 0 10px;font-size:22px}
input,button{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #aeb7c0;font-size:15px}
button{cursor:pointer;background:#1769aa;color:#fff;border:0}button.secondary{background:#e9eef3;color:#222}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.msg{padding:9px;background:#f3f5f7;border-radius:7px;margin:8px 0}
.result{padding:8px;border:1px solid #ddd;border-radius:7px;margin:6px 0;cursor:pointer}
.result:hover{background:#eef6ff}.owner{font-size:13px;color:#555;margin-top:3px}
#map{height:100%;width:100%;background:#dbe6ed}
.info-table{border-collapse:collapse;width:100%;font-size:13px}.info-table td{padding:4px;border-bottom:1px solid #eee;vertical-align:top}.info-table td:first-child{font-weight:bold;white-space:nowrap}
.leaflet-popup-content{margin:12px 14px;max-height:52vh;overflow:auto}
#error{display:none;position:absolute;inset:0;z-index:9999;background:#fff;padding:28px;font-size:18px}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:40% 60%}#sidebar{border-right:0;border-bottom:1px solid #ccd4dc;padding:10px}h2{font-size:19px}.leaflet-control-layers{font-size:13px}}
</style>
</head>
